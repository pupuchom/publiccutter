// ✨ここが生まれ変わったシンプル最強カッターだよ！✨
function splitByCustomKeyword(text, maxLen, keyword, strictSplit, splitEveryStarLabel = false) {
  const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const customRegex = new RegExp(`^${escapeRegExp(keyword)}`, "i");
  const dividerRegex = splitEveryStarLabel ? /^★[^★\n\r]+★/ : customRegex;

  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const blocks = [];
  let currentBlock = [];

  // 1️⃣ まずは指定した文字でバラバラのブロックに分ける（何も捨てない！）
  for (const line of lines) {
    const cleanLine = line.replace(/^[\s\u200B\uFEFF]+/, '');
    if (dividerRegex.test(cleanLine) && currentBlock.length > 0) {
      blocks.push(currentBlock.join('\n'));
      currentBlock = [line];
    } else {
      currentBlock.push(line);
    }
  }
  if (currentBlock.length > 0) {
    blocks.push(currentBlock.join('\n'));
  }

  const finalParts = [];

  // 2️⃣ ✂️チェックONの時：束ねない！毎回スパッと切る！
  if (strictSplit) {
    for (const block of blocks) {
      const trimmed = block.trim();
      if (!trimmed) continue;
      // 1回の発言が長すぎる時だけ段落で切る保険
      if (trimmed.length > maxLen) {
        finalParts.push(...splitRespectParagraph(trimmed, maxLen));
      } else {
        finalParts.push(trimmed);
      }
    }
  } 
  // 3️⃣ 📦チェックOFFの時：上限まで束ねる！
  else {
    let currentBundle = '';
    for (const block of blocks) {
      const trimmed = block.trim();
      if (!trimmed) continue;

      if (currentBundle.length === 0) {
        currentBundle = trimmed;
      } else if (currentBundle.length + 1 + trimmed.length <= maxLen) {
        currentBundle += '\n' + trimmed;
      } else {
        finalParts.push(currentBundle);
        currentBundle = trimmed;
      }
    }
    if (currentBundle) finalParts.push(currentBundle);

    const bundledFinal = [];
    for (const part of finalParts) {
      if (part.length > maxLen) {
        bundledFinal.push(...splitRespectParagraph(part, maxLen));
      } else {
        bundledFinal.push(part);
      }
    }
    return bundledFinal;
  }

  return finalParts;
}

function splitRespectParagraph(text, maxLen) {
  const parts = [];
  if (!text.includes('\n')) {
    for (let i = 0; i < text.length; i += maxLen) parts.push(text.slice(i, i + maxLen));
    return parts;
  }
  const paragraphs = text.split('\n'); 
  let current = "";
  paragraphs.forEach(p => {
    if ((current + "\n" + p).length <= maxLen) {
      current += (current ? "\n" : "") + p;
    } else {
      if (current) parts.push(current);
      current = p;
    }
  });
  if (current) parts.push(current);
  return parts;
}

function splitBySymbolOnlyLines(text, keepDelimiter = false) {
  text = text.replace(/\u000b/g, '\n');
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const parts = [];
  let buffer = [];

  const isSymbolOnlyLine = (line) => {
    const t = line.trim();
    if (!t) return false;
    if (/[A-Za-z0-9\u3040-\u30FF\u3400-\u9FFF]/.test(t)) return false;
    const allowedSymbols = /^[●◆■◇□▲▼＊*]+$/;
    return allowedSymbols.test(t);
  };

  const flush = () => {
    const chunk = buffer.join('\n').trim();
    if (chunk) parts.push(chunk);
    buffer = [];
  };

  for (const line of lines) {
    if (isSymbolOnlyLine(line)) {
      flush();
      if (keepDelimiter) parts.push(line.trim());
    } else {
      buffer.push(line);
    }
  }
  flush();
  return parts;
}

  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim() !== "") { targetIdx = i; break; }
  }

  if (targetIdx !== -1) {
    let title = lines[targetIdx].trim();

const KEEP_IMPORT_SAVE_KEY = "crystal_keep_import_boxes_v1";
let keepImportBoxes = [];

function makeKeepImportId() {
  return "keep_import_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
}

function countKeepImportChars(text) {
  return Array.from((text || "").replace(/\r?\n/g, "")).length;
}

function countKeepImportLines(text) {
  return text ? text.split(/\r?\n/).length : 0;
}

function saveKeepImportBoxes() {
  sessionStorage.setItem(
    KEEP_IMPORT_SAVE_KEY,
    JSON.stringify(keepImportBoxes.map(box => ({
      id: box.id,
      text: box.text || ""
    })))
  );
}

function loadKeepImportBoxes() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(KEEP_IMPORT_SAVE_KEY) || "null");
    if (Array.isArray(saved) && saved.length) {
      keepImportBoxes = saved.map(box => ({
        id: box.id || makeKeepImportId(),
        text: box.text || ""
      }));
    }
  } catch (error) {
    keepImportBoxes = [];
  }

  if (keepImportBoxes.length === 0) {
    keepImportBoxes = [
      { id: makeKeepImportId(), text: "" },
      { id: makeKeepImportId(), text: "" }
    ];
  }
}

function openKeepImportModal() {
  loadKeepImportBoxes();
  renderKeepImportBoxes();
  const modal = document.getElementById("keepImportModal");
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeKeepImportModal() {
  const modal = document.getElementById("keepImportModal");
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  saveKeepImportBoxes();
}

function addKeepImportBox(text = "") {
  keepImportBoxes.push({
    id: makeKeepImportId(),
    text
  });
  renderKeepImportBoxes();

  requestAnimationFrame(() => {
    const boxes = document.querySelectorAll(".keep-import-box");
    const lastBox = boxes[boxes.length - 1];
    if (lastBox) {
      lastBox.scrollIntoView({ behavior: "smooth", block: "center" });
      const area = lastBox.querySelector(".keep-import-text");
      setTimeout(() => area?.focus(), 300);
    }
  });

  showToast("📦文章入力箱を追加したよ");
}

async function pasteIntoKeepImportBox(id) {
  const box = keepImportBoxes.find(item => item.id === id);
  if (!box) return;

  try {
    const clipText = await navigator.clipboard.readText();

    if (box.text.trim()) {
      const overwrite = await showCuteConfirm({
        title: "🌈文章箱を上書きする？",
        message: "この箱には、もう文章が入っているよ。\nクリップボードの内容へ入れ替える？",
        okText: "📋上書きする",
        cancelText: "そのまま残す"
      });
      if (!overwrite) return;
    }

    box.text = clipText;
    renderKeepImportBoxes();
    saveKeepImportBoxes();
    showToast("📋文章箱にペーストしたよ");
  } catch (error) {
    showCutePopup(
      "クリップボードを読み取れなかったよ。<br>箱を長押しして手動で貼り付けてね📋",
      "📥ペーストできなかったよ"
    );
  }
}

async function clearKeepImportBox(id) {
  const box = keepImportBoxes.find(item => item.id === id);
  if (!box || !box.text) {
    showToast("この文章箱はもう空だよ📦");
    return;
  }

  const ok = await showCuteConfirm({
    title: "中身だけ空にする？",
    message: "文章入力箱は残して、\n中に貼った文章だけお片付けするよ。",
    okText: "🧹中身だけ空にする",
    cancelText: "やめる",
    character: "🔥"
  });
  if (!ok) return;

  box.text = "";
  renderKeepImportBoxes();
  saveKeepImportBoxes();
  showToast("文章箱の中身だけ空にしたよ🧹");
}

async function closeKeepImportBox(id) {
  if (keepImportBoxes.length <= 1) {
    showToast("文章入力箱は最低1個残すよ📦");
    return;
  }

  const box = keepImportBoxes.find(item => item.id === id);
  if (!box) return;

  const ok = await showCuteConfirm({
    title: "文章入力箱を閉じる？",
    message: box.text.trim()
      ? "この箱には文章が入っているよ。\n文章ごと入力箱を閉じる？"
      : "この空の文章入力箱を片付ける？",
    okText: box.text.trim() ? "📦文章ごと閉じる" : "📦箱を片付ける",
    cancelText: "箱を残す",
    character: box.text.trim() ? "👑" : "🌈"
  });
  if (!ok) return;

  keepImportBoxes = keepImportBoxes.filter(item => item.id !== id);
  renderKeepImportBoxes();
  saveKeepImportBoxes();
  showToast("文章入力箱を閉じたよ📦");
}

function renderKeepImportBoxes() {
  const area = document.getElementById("keepImportBoxes");
  if (!area) return;

  area.innerHTML = "";

  keepImportBoxes.forEach((box, index) => {
    const wrapper = document.createElement("div");
    wrapper.className = "keep-import-box";

    const head = document.createElement("div");
    head.className = "keep-import-box-head";

    const name = document.createElement("span");
    name.textContent = `📦文章箱${index + 1}`;

    const count = document.createElement("span");
    count.className = "keep-import-count";
    count.textContent = `${countKeepImportChars(box.text)}文字・${countKeepImportLines(box.text)}行`;

    head.appendChild(name);
    head.appendChild(count);

    const textarea = document.createElement("textarea");
    textarea.className = "keep-import-text";
    textarea.placeholder = `文章${index + 1}をここへ貼ってね`;
    textarea.value = box.text;

    textarea.addEventListener("input", () => {
      box.text = textarea.value;
      count.textContent = `${countKeepImportChars(box.text)}文字・${countKeepImportLines(box.text)}行`;
      updateKeepImportSummary();
      saveKeepImportBoxes();
    });

    const actions = document.createElement("div");
    actions.className = "keep-import-actions";

    const pasteButton = document.createElement("button");
    pasteButton.type = "button";
    pasteButton.className = "keep-import-paste";
    pasteButton.textContent = "📋貼り付け";
    pasteButton.addEventListener("click", () => pasteIntoKeepImportBox(box.id));

    const clearButton = document.createElement("button");
    clearButton.type = "button";
    clearButton.className = "keep-import-clear";
    clearButton.textContent = "🧹空にする";
    clearButton.addEventListener("click", () => clearKeepImportBox(box.id));

    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "keep-import-close";
    closeButton.textContent = "📦閉じる";
    closeButton.addEventListener("click", () => closeKeepImportBox(box.id));

    actions.appendChild(pasteButton);
    actions.appendChild(clearButton);
    actions.appendChild(closeButton);

    wrapper.appendChild(head);
    wrapper.appendChild(textarea);
    wrapper.appendChild(actions);
    area.appendChild(wrapper);
  });

  updateKeepImportSummary();
}

function updateKeepImportSummary() {
  const filled = keepImportBoxes.filter(box => box.text.trim());
  const combined = filled.map(box => box.text.trim()).join("\n\n\n");
  const summary = document.getElementById("keepImportSummary");
  if (!summary) return;

  summary.textContent =
    `📦${filled.length}/${keepImportBoxes.length}箱入力・合計${countKeepImportChars(combined)}文字`;
}

function getCombinedKeepImportText() {
  return keepImportBoxes
    .map(box => (box.text || "").trim())
    .filter(Boolean)
    .join("\n\n\n");
}

async function sendKeepsToMain(andSplit) {
  const combined = getCombinedKeepImportText();

  if (!combined) {

}

  const hasText = keepImportBoxes.some(box => box.text.trim());
